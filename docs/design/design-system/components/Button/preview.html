<!-- @dsCard group="Actions" height=520 subtitle="주요 · 보조 · 원형: 아이폰과 워치" -->
<div class="stage">
  <div class="col" style="width:350px">
    <span class="cap">IPHONE · 주요</span>
    <div class="btn btn--primary btn--start"><svg width="16" height="18" viewBox="0 0 16 18"><path d="M2 1.5v15l13-7.5z" fill="var(--bg)"/></svg>러닝 시작</div>
    <div class="btn btn--primary btn--lg">이 기록으로 영상 만들기</div>
    <span class="cap">IPHONE · 보조</span>
    <div style="display:flex;gap:var(--space-10)">
      <div class="btn btn--secondary btn--lg" style="flex:1">돌아가기</div>
      <div class="btn btn--primary btn--lg" style="flex:1">종료</div>
    </div>
    <div class="btn btn--text">나중에</div>
    <div style="display:flex"><div class="btn btn--inline">다시 시작</div></div>
  </div>
  <div class="col">
    <span class="cap">IPHONE · 원형</span>
    <div class="controls">
      <div class="ctl"><div class="circle circle--sub"><span class="i-stop"></span></div><span class="ctl__label">종료</span></div>
      <div class="ctl"><div class="circle circle--main"><span class="i-bar"></span><span class="i-bar"></span></div><span class="ctl__label">일시정지</span></div>
      <div class="ctl"><div class="circle circle--resume"><svg width="26" height="30" viewBox="0 0 16 18" style="margin-left:5px"><path d="M2 1.5v15l13-7.5z" fill="var(--bg)"/></svg></div><span class="ctl__label ctl__label--accent">재개</span></div>
    </div>
    <span class="cap" style="margin-top:var(--space-20)">WATCH · 하단 버튼 (bg-watch 위)</span>
    <div class="stage--black col" style="width:154px;padding:var(--space-16);border-radius:var(--radius-20)">
      <div class="wzone-bot"><div class="wbtn"><span class="i-stop i-stop--w"></span></div><div class="wbtn"><span class="i-bar i-bar--w"></span><span class="i-bar i-bar--w"></span></div></div>
      <div class="wzone-bot"><div class="wbtn"><span class="i-stop i-stop--w"></span></div><div class="wbtn wbtn--accent"><svg width="14" height="16" viewBox="0 0 16 18" style="margin-left:2px"><path d="M2 1.5v15l13-7.5z" fill="var(--bg-watch)"/></svg></div></div>
      <div class="wzone-bot"><div class="wbtn"><span class="i-stop i-stop--w"></span></div><div class="wbtn wbtn--disabled"><span class="i-bar i-bar--w"></span><span class="i-bar i-bar--w"></span></div></div>
      <div class="wbtn wbtn--confirm wbtn--accent">종료</div>
      <div class="wbtn wbtn--confirm">돌아가기</div>
    </div>
  </div>
  <div class="col">
    <span class="cap">WATCH · 원형 시작</span>
    <div class="stage--black" style="padding:var(--space-16);border-radius:var(--radius-20);display:flex;gap:var(--space-16)">
      <div class="wstart"><svg width="30" height="34" viewBox="0 0 16 18" style="margin-left:5px"><path d="M2 1.5v15l13-7.5z" fill="var(--bg-watch)"/></svg></div>
    </div>
  </div>
</div>
