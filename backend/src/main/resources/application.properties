spring.application.name=runary

# 로컬 개발용 H2 파일 DB. 서버를 다시 켜도 계정이 남는다
spring.datasource.url=jdbc:h2:file:./data/runary
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 실기기가 같은 Wi-Fi의 Mac으로 접속한다
server.address=0.0.0.0

# app.jwt-secret(우리 서버 토큰 서명 키, Base64 32바이트 이상)은 저장소에 두지 않는다.
# backend/config/application.properties(gitignore)나 환경변수 APP_JWT_SECRET으로 넣는다
app.apple.bundle-id=com.mechuri.runmechuri
app.kakao.app-id=1658837

app.apple.team-id=BT2KSYYPDF
# 탈퇴 시 Apple 토큰 해지용 Sign in with Apple 키. 저장소에 두지 않는다. backend/config/application.properties에
# app.apple.key-id=<Key ID>, app.apple.private-key-path=config/AuthKey_<Key ID>.p8 을 넣는다
